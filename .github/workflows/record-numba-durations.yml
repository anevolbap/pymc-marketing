name: Record durations, both linkers

# Records per-test timings for both linkers in the SAME run, so every
# numba-versus-cvm comparison is within-run. The earlier numbers compared two
# recordings made on different days, which is defensible (aggregate totals
# reproduce to 0.4% across independent runs) but not worth arguing about when
# removing the objection costs one cycle.
#
# Recording a whole pass in one job does not survive here, it gets cancelled at
# about 63 minutes, so the fast pass is sharded six ways and the slow pass twice.
# --clean-durations makes each shard write only the tests it ran, and pytest-split
# deselects rather than skips, so the shards partition the suite and union with no
# stale entries. Each arm seeds its split from its own linker's file, which is only
# used to spread the shards; every value is discarded on write.

on:
  push:
    branches: [measure/numba-durations]
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    name: fast ${{ matrix.linker }} (${{ matrix.group }}/6)
    strategy:
      fail-fast: false
      matrix:
        linker: [cvm, numba]
        group: [1, 2, 3, 4, 5, 6]
    env:
      PYTENSOR_FLAGS: linker=${{ matrix.linker }}
      DUR: .test_durations_${{ matrix.linker }}
      SEED: .test_durations
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      # Both linkers seed from the SAME file, so group N holds exactly the same
      # tests for cvm and for numba. Otherwise the two get different shards, a
      # class-scoped fixture is rebuilt by a different "first user" in each, and
      # the per-test comparison measures fixture attribution instead of the linker.
      - name: Seed from the shared file
        run: |
          if [ "$SEED" != "$DUR" ]; then cp "$SEED" "$DUR"; fi
      - name: Fingerprint the seed
        run: sha256sum "$DUR" | cut -d' ' -f1 > seed.sha
      - name: Record
        run: |
          uv run --no-sync --frozen pytest \
                 --splits 6 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --store-durations --clean-durations \
                 --durations-path "$DUR" \
                 ${{ matrix.linker == 'numba' && '--no-cov' || '' }} -q
        continue-on-error: true
      # A cancelled recording leaves the seed untouched, and copying it would
      # smuggle the old timings into the merge. Refuse to ship an unchanged file.
      - name: Stage
        run: |
          mkdir -p out
          if [ "$(sha256sum "$DUR" | cut -d' ' -f1)" = "$(cat seed.sha)" ]; then
            echo "::warning::fast ${{ matrix.linker }} ${{ matrix.group }} did not write, shipping empty"
            echo '{}' > out/fast-${{ matrix.linker }}-${{ matrix.group }}.json
          else
            cp "$DUR" out/fast-${{ matrix.linker }}-${{ matrix.group }}.json
          fi
          python3 -c "import json;print('entries', len(json.load(open('out/fast-${{ matrix.linker }}-${{ matrix.group }}.json'))))"
      - uses: actions/upload-artifact@v7
        with:
          name: dur-fast-${{ matrix.linker }}-${{ matrix.group }}
          path: out/fast-${{ matrix.linker }}-${{ matrix.group }}.json
          if-no-files-found: error

  slow:
    runs-on: ubuntu-latest
    name: slow ${{ matrix.linker }} (${{ matrix.group }}/2)
    strategy:
      fail-fast: false
      matrix:
        linker: [cvm, numba]
        group: [1, 2]
    env:
      PYTENSOR_FLAGS: linker=${{ matrix.linker }}
      DUR: .test_durations_slow_${{ matrix.linker }}
      SEED: .test_durations_slow_cvm
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install package and dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      # Same shared seed for both linkers, same reason as the fast pass.
      - name: Seed from the shared file
        run: |
          if [ "$SEED" != "$DUR" ]; then cp "$SEED" "$DUR"; fi
      - name: Fingerprint the seed
        run: sha256sum "$DUR" | cut -d' ' -f1 > seed.sha
      - name: Record
        run: |
          uv run --no-sync --frozen pytest --only-slow \
                 --splits 2 --group ${{ matrix.group }} \
                 --splitting-algorithm least_duration \
                 --store-durations --clean-durations \
                 --durations-path "$DUR" \
                 ${{ matrix.linker == 'numba' && '--no-cov' || '' }} -q
        continue-on-error: true
      - name: Stage
        run: |
          mkdir -p out
          if [ "$(sha256sum "$DUR" | cut -d' ' -f1)" = "$(cat seed.sha)" ]; then
            echo "::warning::slow ${{ matrix.linker }} ${{ matrix.group }} did not write, shipping empty"
            echo '{}' > out/slow-${{ matrix.linker }}-${{ matrix.group }}.json
          else
            cp "$DUR" out/slow-${{ matrix.linker }}-${{ matrix.group }}.json
          fi
          python3 -c "import json;print('entries', len(json.load(open('out/slow-${{ matrix.linker }}-${{ matrix.group }}.json'))))"
      - uses: actions/upload-artifact@v7
        with:
          name: dur-slow-${{ matrix.linker }}-${{ matrix.group }}
          path: out/slow-${{ matrix.linker }}-${{ matrix.group }}.json
          if-no-files-found: error

  merge:
    needs: [fast, slow]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dur-*
          merge-multiple: true
          path: shards
      - name: Merge the shards
        run: |
          python3 - <<'PY'
          import glob, json, os

          os.makedirs("merged", exist_ok=True)
          for pas in ("fast", "slow"):
              for linker in ("cvm", "numba"):
                  out, overlaps = {}, 0
                  paths = sorted(glob.glob(f"shards/{pas}-{linker}-*.json"))
                  for path in paths:
                      part = json.load(open(path))
                      overlaps += len(set(part) & set(out))
                      print(f"  {path}: {len(part)} entries")
                      out.update(part)
                  name = f"test_durations_{linker}" if pas == "fast" else f"test_durations_slow_{linker}"
                  json.dump(out, open(f"merged/{name}", "w"), indent=2, sort_keys=True)
                  print(f"{pas} {linker}: {len(paths)} shards, {len(out)} entries, "
                        f"{overlaps} overlapping, {sum(out.values()):.0f}s")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: durations-merged
          path: merged/
          if-no-files-found: error
