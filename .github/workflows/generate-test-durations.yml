name: Generate Test Durations

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  # One durations file per (linker, selection). pytest-split has to be given a
  # file recorded under the same selection the consuming job uses, because
  # --only-slow skips the fast tests rather than deselecting them: they are still
  # collected, and get stored at ~0s. A single file recorded with plain `pytest`
  # therefore says the slow tests are free, which is what test_slow was splitting
  # on. The two linkers need their own files as well, their profiles differ by
  # about 1.8x in total and more per test.
  record:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        linker: [cvm, numba]
    env:
      PYTENSOR_FLAGS: linker=${{ matrix.linker }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install 3.13
      - name: Set up environment
        run: uv venv --python 3.13
      - name: Install dependencies
        run: |
          sudo apt-get install graphviz graphviz-dev
          uv pip install -e .[test]
      - name: Record fast test durations
        run: |
          uv run pytest --store-durations \
                 --durations-path .test_durations_${{ matrix.linker }} \
                 --no-cov -q
        continue-on-error: true  # Record durations even if some tests fail
      - name: Ensure newline at end of fast durations
        run: |
          f=.test_durations_${{ matrix.linker }}
          [ -f "$f" ] && [ -n "$(tail -c1 "$f")" ] && echo >> "$f" || true
      # Upload each file as soon as it exists. The numba recording takes over an
      # hour, so a run that dies partway still hands back what it did finish.
      # Paths are listed explicitly: a leading-dot glob does not match here.
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles(format('.test_durations_{0}', matrix.linker)) != '' }}
        with:
          name: durations-fast-${{ matrix.linker }}
          path: .test_durations_${{ matrix.linker }}
          if-no-files-found: error
      - name: Record slow test durations
        run: |
          uv run pytest --only-slow --store-durations \
                 --durations-path .test_durations_slow_${{ matrix.linker }} \
                 --no-cov -q
        continue-on-error: true
      - name: Ensure newline at end of slow durations
        run: |
          f=.test_durations_slow_${{ matrix.linker }}
          [ -f "$f" ] && [ -n "$(tail -c1 "$f")" ] && echo >> "$f" || true
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles(format('.test_durations_slow_{0}', matrix.linker)) != '' }}
        with:
          name: durations-slow-${{ matrix.linker }}
          path: .test_durations_slow_${{ matrix.linker }}
          if-no-files-found: error

  open_pr:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: durations-*
          merge-multiple: true
          path: .
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update test durations"
          branch: update-test-durations
          delete-branch: true
          title: "chore: update test durations"
          add-paths: |
            .test_durations_cvm
            .test_durations_numba
            .test_durations_slow_cvm
            .test_durations_slow_numba
          body: |
            ## Automated Test Durations Update

            Updates the `.test_durations_*` files that pytest-split uses to balance
            the test groups in CI. One file per linker and per selection, because
            the two linkers have different profiles and `--only-slow` records the
            fast tests at ~0s.

            **Details:**
            - 🤖 Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 📅 Trigger: ${{ github.event_name == 'schedule' && 'Scheduled (weekly)' || format('Manual trigger by @{0}', github.actor) }}
          labels: |
            no releasenotes
            maintenance
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash ${{ steps.cpr.outputs.pull-request-number }}
